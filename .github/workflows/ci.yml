name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.99.1
      - run: rustup target add ${{ matrix.target }}
      - run: bun run plugin:digest
      - run: bun run contract:check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # tests/binary.rs execs a freshly written file; parallel tests race on it (ETXTBSY)
      - run: cargo test --locked -- --test-threads=1
      - run: bun run plugin:build --out dist --target ${{ matrix.target }}
